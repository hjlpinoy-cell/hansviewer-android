name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Unpack uploaded zip
        run: |
          ls -la
          ZIP=$(find . -name '*.zip' -not -path './.git/*' | head -1)
          if [ -n "$ZIP" ]; then
            echo "Unpacking $ZIP"
            mkdir -p /tmp/project
            unzip -o -q "$ZIP" -d /tmp/project
          else
            cp -r . /tmp/project
          fi

      - name: Build
        run: |
          SETTINGS=$(find /tmp/project -name settings.gradle.kts | head -1)
          if [ -z "$SETTINGS" ]; then echo "settings.gradle.kts not found - upload is incomplete"; exit 1; fi
          cd "$(dirname "$SETTINGS")"
          echo "Building in $(pwd)"
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/HansViewer.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: HansViewer-apk
          path: HansViewer.apk

      - name: Publish as a release (easy download on the tablet)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: HansViewer for Android — build ${{ github.run_number }}
          body: Download HansViewer.apk below on your tablet and open it to install or update.
          files: HansViewer.apk
          make_latest: true
