name: Build HansViewer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Unpack uploaded zip
        run: |
          ZIP=$(find . -name '*.zip' -not -path './.git/*' | head -1)
          mkdir -p /tmp/project
          if [ -n "$ZIP" ]; then echo "Unpacking $ZIP"; unzip -o -q "$ZIP" -d /tmp/project; else cp -r . /tmp/project; fi

      - name: Prepare Play Store upload key
        env:
          KEY_B64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEY_B64" ]; then
            echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "UPLOAD_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Upload key found"
          else
            echo "No upload key secret yet - the Play Store bundle will be skipped"
          fi

      - name: Build Linux .deb, Android .apk and Play Store .aab
        env:
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          BUILD=$(find /tmp/project -name build.sh -not -path '*/android/*' | head -1)
          if [ -z "$BUILD" ]; then echo "build.sh not found - upload the new zip"; exit 1; fi
          bash "$BUILD" "$GITHUB_WORKSPACE/out"

      - uses: actions/upload-artifact@v4
        with:
          name: HansViewer
          path: out/*

      - name: Publish as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: HansViewer — build ${{ github.run_number }}
          body: |
            Android: download HansViewer.apk on the tablet or phone and open it to install or update.
            Linux: download the .deb and install it with: sudo apt install ./hansviewer_*_all.deb
            Play Store: upload HansViewer-play.aab in the Play Console.
          files: out/*
          make_latest: true
